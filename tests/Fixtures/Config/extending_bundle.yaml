neusta_converter:
  converters:
    # converter type contributed by ExtendingBundle
    test.reversing.converter:
      reversing:
        target_factory: Neusta\ConverterBundle\Tests\Fixtures\Model\Target\Factory\PersonFactory
        source: fullName
        target: fullName

    # "context_configurators" decorates by service id regardless of the converter type, so it must
    # also work for a converter type contributed by another bundle, not just "generic".
    test.reversing.converter.with_context:
      reversing:
        target_factory: Neusta\ConverterBundle\Tests\Fixtures\Model\Target\Factory\PersonFactory
        source: fullName
        target: fullName
      context_configurators:
        - Neusta\ConverterBundle\Tests\Fixtures\Context\AgeContextConfigurator

    # populator type contributed by ExtendingBundle, used as a nested property type
    test.uppercase.converter:
      generic:
        target_factory: Neusta\ConverterBundle\Tests\Fixtures\Model\Target\Factory\PersonFactory
        properties:
          fullName:
            uppercase:
              source: fullName
              trim: true

  populators:
    # ... and as a standalone populator
    test.uppercase.populator:
      uppercase:
        target: fullName
        source: fullName

services:
  Neusta\ConverterBundle\Tests\Fixtures\Model\Target\Factory\PersonFactory: ~
  Neusta\ConverterBundle\Tests\Fixtures\Context\AgeContextConfigurator: ~
